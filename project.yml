name: Selenite
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4NY63S72W9
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  SeleniteKit:
    path: SeleniteKit
targets:
  Selenite-tvOS:
    type: application
    platform: tvOS
    sources: [Selenite]
    dependencies:
      - package: SeleniteKit
        product: HostKit
      - package: SeleniteKit
        product: StreamKit
      - package: SeleniteKit
        product: InputKit
      - package: SeleniteKit
        product: AppCore
      - package: SeleniteKit
        product: MoonlightCore
    info:
      path: Selenite/Info.plist
      properties:
        CFBundleDisplayName: Selenite
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: Selenite connects to Sunshine hosts on your local network.
        NSBonjourServices:
          - _nvstream._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.superuser404.Selenite
        PRODUCT_NAME: Selenite
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_BRAND_ASSETS_NAME: "App Icon & Top Shelf Image"
schemes:
  Selenite-tvOS:
    build:
      targets:
        Selenite-tvOS: all
    run:
      config: Debug
