name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test
        run: swift test --package-path SeleniteKit
      - name: Slot symbols
        run: swift build --package-path SeleniteKit && Scripts/check-slot-symbols.sh
